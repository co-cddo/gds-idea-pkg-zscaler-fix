[project]
name = "gds-idea-pkg-zscaler-fix"
description = "Dev-only fix for Python HTTPS failing behind the corporate Zscaler TLS-inspecting proxy"
readme = "README.md"
authors = [
    { name = "David Gillespie", email = "david.gillespie@digital.cabinet-office.gov.uk" }
]
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/zscaler_fix/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zscaler_fix"]

[tool.hatch.build.targets.wheel.force-include]
"src/zscaler_fix.pth" = "zscaler_fix.pth"
"src/zscaler_fix/zscaler-root-ca.pem" = "zscaler_fix/zscaler-root-ca.pem"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["src/zscaler_fix/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
known-first-party = ["zscaler_fix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: tests that require external services",
    "asyncio: run an async test under pytest-asyncio (only used within integration tests, which require the integration-test dependency group)",
]

[tool.gds-idea-app-kit]
framework = "python"
app_name = "zscaler-fix"
tool_version = "0.5.5.dev1+g6a45258b4"

[tool.gds-idea-app-kit.files]
LICENCE = "sha256:21cc325b3181cb748845827425d37ce04b3dc563835bbf50fafbc56a5eb68c48"
".github/CODEOWNERS" = "sha256:464aa53eb8be8c9b61185674b4dabec6cacbafa904aa48b46facdcd9a18e1fc5"
".github/workflows/ci.yml" = "sha256:baed13493483724c4f2cdec0df9d378dfc2f8df8a0f01bfb65a108c9d7af3d29"
".github/dependabot.yml" = "sha256:8472c537c3808394c9200ac7f67e61ce565981583c6f7f381339f1df255fb318"
".pre-commit-config.yaml" = "sha256:376617ea56a3e3b6691e423e33c1faeff299e95205c54208bbd3b3a5c619bd57"
".github/workflows/release.yml" = "sha256:d2c22e66042f7f7fca4dc1066ff3ffaa4303df9c8a57953684a0a927731b1fe6"
[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.0.0",
    "ruff>=0.16.3",
]
integration-test = [
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "boto3>=1.43.71",
    "pytest-asyncio>=0.25.0",
]
